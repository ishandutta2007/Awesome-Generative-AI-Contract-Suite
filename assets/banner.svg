<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#0a0e1c" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: #a5b4fc;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.65; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .card-float-1 {
      animation: floatCard 6s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard 7s ease-in-out 1s infinite;
    }
    .stream-line {
      stroke-dasharray: 12 8;
      animation: streamFlow 4s linear infinite;
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Background Elements -->
  <g class="orb-1">
    <circle cx="180" cy="120" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.4" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="280" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.35" />
  </g>
  <circle cx="600" cy="380" r="120" fill="#06b6d4" filter="url(#glow)" opacity="0.2" />

  <!-- Flowing Dynamic Data Streams in Background -->
  <path class="stream-line" d="M 50 350 C 300 280, 500 400, 750 320 C 950 250, 1050 340, 1150 290" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  <path class="stream-line" d="M 80 80 C 350 140, 600 60, 850 120 C 1000 160, 1100 90, 1160 110" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Decorative Corner Framing -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 1170 50 L 1170 30 L 1150 30" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 30 370 L 30 390 L 50 390" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 1170 370 L 1170 390 L 1150 390" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.8" />

  <!-- Floating Feature Micro-Cards (Right Side) -->
  <g class="card-float-1" transform="translate(870, 75)">
    <rect width="260" height="90" rx="14" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
    <circle cx="35" cy="45" r="18" fill="#4f46e5" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 28 45 L 33 50 L 43 40" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="38" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">AI Contract Analysis</text>
    <text x="68" y="58" font-family="-apple-system, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">Autonomous Risk &amp; Clauses</text>
  </g>

  <g class="card-float-2" transform="translate(890, 205)">
    <rect width="250" height="90" rx="14" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
    <circle cx="35" cy="45" r="18" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5" />
    <path d="M 27 45 H 43 M 35 37 V 53" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round" />
    <text x="68" y="38" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Word DOCX Redlines</text>
    <text x="68" y="58" font-family="-apple-system, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">True Tracked Changes</text>
  </g>

  <!-- FOREGROUND TEXT ELEMENTS (Kept Clear and Prominent) -->
  <g transform="translate(80, 0)">
    <!-- Tagline Badge -->
    <g transform="translate(0, 95)">
      <rect width="260" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="15" r="5" fill="#22c55e" />
      <text x="32" y="20" class="tagline-text">LEGALTECH &amp; CLM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="175" class="title-text">
      Awesome Generative AI
    </text>
    <text x="0" y="225" class="title-text" fill="url(#primary-glow)">
      Contract Suite
    </text>

    <!-- Subtitle -->
    <text x="0" y="275" class="subtitle-text">
      Curated Enterprise SaaS Platforms &amp; Self-Hosted Open-Source Legal Agents
    </text>
    <text x="0" y="305" class="subtitle-text" font-size="16" fill="#64748b">
      AI-Powered Drafting • Autonomous Redlining • Intelligent Risk Audits • Portfolio CLM
    </text>

    <!-- Interactive Badges / Pills -->
    <g transform="translate(0, 335)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="18" y="20" class="pill-text">⚡ LLM Drafting</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="160" y="20" class="pill-text">📝 Word Redlines</text>

      <!-- Pill 3 -->
      <rect x="289" y="0" width="125" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="307" y="20" class="pill-text">🛡️ Data Privacy</text>

      <!-- Pill 4 -->
      <rect x="426" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="444" y="20" class="pill-text">🚀 Self-Hosted CLM</text>
    </g>
  </g>
</svg>